apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # По умолчанию — base64 от {"auths":{}}: секрет существует и валиден,
  # публичные образы тянутся без учётных данных.
  .dockerconfigjson: {{ .Values.imagePullSecrets.dockerconfigjson | default "eyJhdXRocyI6e319" }}
type: kubernetes.io/dockerconfigjson