apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson
  namespace: cinemaabyss
data:
  # По умолчанию — base64 от {"auths":{}}: секрет валиден, публичные образы
  # тянутся без учётных данных.
  #
  # Для приватных образов ghcr.io замените значение на результат:
  #   cat ~/.docker/config.json | base64 | tr -d '\n'
  # где в config.json лежит "auth": base64(логин:PAT с правом read:packages).
  .dockerconfigjson: eyJhdXRocyI6e319
type: kubernetes.io/dockerconfigjson
